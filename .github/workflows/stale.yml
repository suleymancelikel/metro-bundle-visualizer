name: Mark stale issues

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue has been inactive for 60 days. It will be closed in 14 days unless there is new activity."
          close-issue-message: "Closing due to inactivity. Feel free to reopen if the issue is still relevant."
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,help wanted,good first issue'
          stale-issue-label: stale
