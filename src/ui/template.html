<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>/* TITLE_PLACEHOLDER */</title>
  <style>/* STYLES_PLACEHOLDER */</style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">metro<span class="logo-dot">.</span>visualizer</span>
        <span class="platform-badge" id="platform-badge"></span>
      </div>
      <div class="hero-stat">
        <span class="hero-stat__value"><span id="hero-value"></span><span class="hero-stat__unit" id="hero-unit"></span></span>
        <span class="hero-stat__sub" id="hero-sub"></span>
      </div>
      <div class="header-right">
        <div class="search-wrap">
          <kbd class="search-hint">/</kbd>
          <input type="search" id="search" placeholder="Filter packages or paths…" autocomplete="off">
          <button class="search-clear" id="search-clear" title="Clear search (Esc)" style="display:none">×</button>
          <span class="search-count" id="search-count"></span>
        </div>
        <span class="meta" id="meta"></span>
      </div>
    </header>
    <main class="main">
      <div class="treemap-wrap">
        <div class="breadcrumb" id="breadcrumb" style="display:none">
          <button class="breadcrumb__back" id="breadcrumb-back">← All packages</button>
          <span class="breadcrumb__pkg" id="breadcrumb-pkg"></span>
        </div>
        <div id="treemap-container"></div>
      </div>
      <aside id="sidebar" class="sidebar sidebar--empty">
        <div class="sidebar-overview" id="sb-overview">
  <p class="sb-section-title">Bundle overview</p>
  <div class="sb-metrics" id="sb-overview-metrics">
    <div class="sb-metric">
      <span class="sb-metric__value"><span id="ov-size-val">—</span><span class="unit" id="ov-size-unit"></span></span>
      <span class="sb-metric__label">total</span>
    </div>
    <div class="sb-metric">
      <span class="sb-metric__value" id="ov-modules">—</span>
      <span class="sb-metric__label">modules</span>
    </div>
    <div class="sb-metric">
      <span class="sb-metric__value" id="ov-packages">—</span>
      <span class="sb-metric__label">packages</span>
    </div>
  </div>
  <p class="sb-section-title" style="margin-top:14px">Top packages</p>
  <ul class="file-bars" id="sb-top-list"></ul>
  <p class="sb-hint">Click a package to inspect its files</p>
</div>
        <div class="sidebar-content" style="display:none">
          <div class="sb-header">
            <span class="sb-pkg-badge" id="sb-badge">npm</span>
            <h2 class="sb-name" id="sb-name"></h2>
          </div>
          <div class="sb-metrics">
            <div class="sb-metric">
              <span class="sb-metric__value" id="sb-size-val">—<span class="unit" id="sb-size-unit"></span></span>
              <span class="sb-metric__label">size</span>
            </div>
            <div class="sb-metric">
              <span class="sb-metric__value" id="sb-share-val">—<span class="unit">%</span></span>
              <span class="sb-metric__label">of bundle</span>
            </div>
            <div class="sb-metric">
              <span class="sb-metric__value" id="sb-files-val">—</span>
              <span class="sb-metric__label">files</span>
            </div>
          </div>
          <p class="sb-section-title">Top files by size</p>
          <ul id="sb-file-list" class="file-bars"></ul>
        </div>
      </aside>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
  <script>window.__BUNDLE_STATS__ = /* STATS_PLACEHOLDER */;</script>
  <script>/* D3_PLACEHOLDER */</script>
  <script>/* TREEMAP_PLACEHOLDER */</script>
</body>
</html>
