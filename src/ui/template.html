<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>metro-bundle-visualizer</title>
  <style>/* STYLES_PLACEHOLDER */</style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">metro-bundle-visualizer</span>
        <span class="total-size" id="total-size"></span>
      </div>
      <div class="header-right">
        <input type="search" id="search" placeholder="Search packages…" autocomplete="off">
        <span class="meta" id="meta"></span>
      </div>
    </header>
    <main class="main">
      <div id="treemap-container"></div>
      <aside id="sidebar" class="sidebar sidebar--empty">
        <div class="sidebar-placeholder">Click a package to see details</div>
        <div class="sidebar-content" style="display:none">
          <h2 id="sb-name"></h2>
          <div class="sb-stat"><span>Size</span><strong id="sb-size"></strong></div>
          <div class="sb-stat"><span>Share</span><strong id="sb-share"></strong></div>
          <div class="sb-stat"><span>Files</span><strong id="sb-files"></strong></div>
          <h3>Top files</h3>
          <ul id="sb-file-list"></ul>
        </div>
      </aside>
    </main>
    <footer class="footer" id="footer"></footer>
  </div>
  <script>window.__BUNDLE_STATS__ = /* STATS_PLACEHOLDER */;</script>
  <script>/* D3_PLACEHOLDER */</script>
  <script>/* TREEMAP_PLACEHOLDER */</script>
</body>
</html>
